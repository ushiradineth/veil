name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test ./src/test.ts

      - name: Build publish artifacts
        run: bun run build:package

      - name: Smoke test Node bundle
        run: |
          output=$(node dist/bin.js 2>&1 || true)
          if ! echo "${output}" | grep -q "Usage:"; then
            echo "Smoke test failed: bundle did not produce usage output"
            echo "Got: ${output}"
            exit 1
          fi

      - name: Verify package tarball
        run: npm pack --dry-run
