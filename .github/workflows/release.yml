name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Validate branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release must run from $DEFAULT_BRANCH, got $REF_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test ./src/test.ts

      - name: Build publish artifacts
        run: bun run build:package

      - name: Smoke test Node bundle
        run: |
          output=$(node dist/bin.js 2>&1 || true)
          if ! echo "${output}" | grep -q "Usage:"; then
            echo "Smoke test failed: bundle did not produce usage output"
            echo "Got: ${output}"
            exit 1
          fi

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Validate tag availability
        id: validate-tag
        run: |
          latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          if [[ ! "$latestTag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest tag must be semver (vX.Y.Z), got: $latestTag"
            exit 1
          fi
          echo "latest_tag=$latestTag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: prep
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          LATEST_TAG: ${{ steps.validate-tag.outputs.latest_tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const bump = process.env.VERSION_BUMP || 'patch';
          const latestTag = process.env.LATEST_TAG || 'v0.0.0';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const current = String(pkg.version || '0.1.0');
          if (!/^\d+\.\d+\.\d+$/.test(current)) {
            throw new Error(`Unsupported package version: ${current}`);
          }

          const latestVersion = latestTag.slice(1);
          if (current !== latestVersion) {
            throw new Error(`package.json version ${current} must match latest tag ${latestTag} before release`);
          }

          let [major, minor, patch] = latestVersion.split('.').map((v) => Number(v));
          if (bump === 'major') { major += 1; minor = 0; patch = 0; }
          else if (bump === 'minor') { minor += 1; patch = 0; }
          else if (bump === 'patch') { patch += 1; }
          else { throw new Error(`Unsupported bump type: ${bump}`); }

          const nextVersion = `${major}.${minor}.${patch}`;
          const nextTag = `v${nextVersion}`;

          pkg.version = nextVersion;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${nextTag}\n`);
          NODE

      - name: Cleanup on failure
        if: failure()
        run: |
          git checkout -- package.json || true
          git clean -fd || true

      - name: Commit and tag locally
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists on origin"
            exit 1
          fi

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${VERSION}"
          git tag "${TAG}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Cleanup on publish failure
        if: failure()
        run: |
          git reset --hard HEAD~1 || true
          git tag -d ${{ steps.prep.outputs.tag }} || true

      - name: Push commit and tag
        env:
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          git push origin HEAD
          git push origin "${TAG}"

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          notes=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body 2>/dev/null || true)

          if [ -z "$(printf '%s' "${notes}" | grep -E '^[[:space:]]*[-*] ' || true)" ]; then
            latest_tag=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
            if [ -n "${latest_tag}" ]; then
              range="${latest_tag}..${TAG}"
            else
              range="${TAG}"
            fi
            log=$(git log "${range}" --pretty=format:"- %s" | grep -v "^- chore(release):" || true)
            if [ -z "${log}" ]; then
              log="- Release ${TAG}"
            fi
            printf -v notes '## What'\''s Changed\n\n%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "${log}" "${GITHUB_REPOSITORY}" "${latest_tag:-v0.0.0}" "${TAG}"
          fi

          npm_link="**npm**: [\`@ushiradineth/veil@${TAG#v}\`](https://www.npmjs.com/package/@ushiradineth/veil/v/${TAG#v})"
          printf '%s\n\n%s\n' "${notes}" "${npm_link}" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md --verify-tag
