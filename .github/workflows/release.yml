name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the created PR triggers CI.
          # Falls back to GITHUB_TOKEN if RELEASE_PR_TOKEN is not set,
          # but CI may not trigger on the resulting PR in that case.
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release must be dispatched from $DEFAULT_BRANCH, got $REF_NAME"
            exit 1
          fi

      - name: Validate latest tag
        id: validate_tag
        run: |
          latestTag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$latestTag" ]; then
            latestTag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          fi
          if [ -z "$latestTag" ]; then
            latestTag=v0.0.0
          fi
          if [[ ! "$latestTag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest tag must be semver (vX.Y.Z), got: $latestTag"
            exit 1
          fi
          echo "Resolved latest tag: $latestTag"
          echo "latest_tag=$latestTag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: prep
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          LATEST_TAG: ${{ steps.validate_tag.outputs.latest_tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const bump = process.env.VERSION_BUMP || 'patch';
          const latestTag = process.env.LATEST_TAG || 'v0.0.0';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const current = String(pkg.version || '0.1.0');
          if (!/^\d+\.\d+\.\d+$/.test(current)) {
            throw new Error(`Unsupported package version: ${current}`);
          }

          const latestVersion = latestTag.slice(1);
          if (current !== latestVersion) {
            throw new Error(`package.json version ${current} must match latest tag ${latestTag} before release`);
          }

          let [major, minor, patch] = latestVersion.split('.').map((v) => Number(v));
          if (bump === 'major') { major += 1; minor = 0; patch = 0; }
          else if (bump === 'minor') { minor += 1; patch = 0; }
          else if (bump === 'patch') { patch += 1; }
          else { throw new Error(`Unsupported bump type: ${bump}`); }

          const nextVersion = `${major}.${minor}.${patch}`;
          const nextTag = `v${nextVersion}`;

          pkg.version = nextVersion;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${nextTag}\n`);
          NODE

      - name: Commit version bump on release branch
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          BRANCH="release/${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add package.json
          git commit -m "chore(release): bump version to ${VERSION}"
          git push origin "${BRANCH}" --force-with-lease

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          VERSION: ${{ steps.prep.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="release/${TAG}"
          TITLE="chore(release): ${TAG}"
          BODY="Automated release bump to \`${VERSION}\`.

          Merging this PR to \`${DEFAULT_BRANCH}\` will trigger the publish workflow which:
          - Creates and pushes tag \`${TAG}\`
          - Publishes \`@ushiradineth/veil@${VERSION}\` to npm
          - Creates a GitHub release with generated notes
          - Submits a Homebrew formula update to the tap repository

          **Required secrets before merging:** \`NPM_TOKEN\`, \`HOMEBREW_TAP_GITHUB_TOKEN\`"

          existing=$(gh pr list --head "${BRANCH}" --base "${DEFAULT_BRANCH}" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            echo "Updating existing PR #${existing}"
            gh pr edit "${existing}" --title "${TITLE}" --body "${BODY}"
          else
            echo "Creating new release PR"
            gh pr create \
              --head "${BRANCH}" \
              --base "${DEFAULT_BRANCH}" \
              --title "${TITLE}" \
              --body "${BODY}"
          fi
